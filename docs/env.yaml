# editor — Project Environment
# 参照 standard 规范：<standard_path>/docs/concepts/project-env-spec.md
# 生成时间: 2026-05-18 (install Step 2)
# 流派: github

project:
  name: editor
  type: business
  flow: github
  role: FE
  stack: node-typescript

repo:
  remote: git@github.com:Corray/editor.git
  default_branch: main
  current_branch: master  # ⚠ 本地实际分支为 master，常规建议改为 main 对齐 github 默认

paths:
  code_root: .
  docs_root: docs
  adr: docs/adr           # 目录待创建
  audit: docs/audit
  problems: docs/problems
  handoff: docs/handoff

build:
  package_manager: pnpm
  compile_cmd: pnpm typecheck      # tsc --noEmit (TS strict)
  test_cmd: pnpm test:run          # Vitest single-run
  test_coverage_cmd: pnpm test:coverage
  e2e_cmd: pnpm e2e                # Playwright (Chromium + Webkit + mobile-safari)
  lint_cmd: ~                      # [TBD] MVP 不上 ESLint，按需后加

# 当前进行中的 GitHub milestone（github 流派对应 active_milestones）
active_milestones: []     # [TBD] 待 issue_repo 就绪后填，对应 GitHub milestone number 列表
